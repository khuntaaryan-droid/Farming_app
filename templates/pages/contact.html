{% extends 'base.html' %}
{% block title %}Contact Us - Agri Shop{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <h2 class="text-success fw-bold mb-4">Contact Us</h2>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Send Message</button>
                </form>
            </div>
        </div>
        
        <div class="row mt-5 text-center">
            <div class="col-md-4">
                <i class="bi bi-geo-alt-fill text-success fs-2 mb-2 d-block"></i>
                <h5>Address</h5>
                <p class="text-muted small">Kisan Bhavan, Gujarat, India</p>
            </div>
            <div class="col-md-4">
                <i class="bi bi-telephone-fill text-success fs-2 mb-2 d-block"></i>
                <h5>Phone</h5>
                <p class="text-muted small">+91 1800-KISAN-HELP</p>
            </div>
            <div class="col-md-4">
                <i class="bi bi-envelope-fill text-success fs-2 mb-2 d-block"></i>
                <h5>Email</h5>
                <p class="text-muted small">support@agrishop.com</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
