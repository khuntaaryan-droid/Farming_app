{% extends 'base.html' %}
{% block title %}Ask a Question - Agri Shop{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'forum_list' %}">Forum</a></li>
                <li class="breadcrumb-item active" aria-current="page">Ask Question</li>
            </ol>
        </nav>
        
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0">Ask the Kisan Community</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Question Title</label>
                        <input type="text" class="form-control form-control-lg" name="title" placeholder="e.g. Which fertilizer is best for wheat in winter?" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Details</label>
                        <textarea class="form-control" name="content" rows="6" placeholder="Provide more details about your crop, soil type, or problem..." required></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'forum_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Post Question</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
