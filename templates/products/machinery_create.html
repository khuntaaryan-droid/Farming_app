{% extends 'base.html' %}
{% block title %}List Machinery - Agri Shop{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-warning py-3">
                <h4 class="mb-0 fw-bold text-dark"><i class="bi bi-plus-circle"></i> List Machinery for Rent</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Machine Name</label>
                        <input type="text" class="form-control" name="name" placeholder="e.g. Mahindra Tractor, Thresher..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Hourly Rate (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" step="0.01" class="form-control" name="hourly_rate" placeholder="500" required>
                            <span class="input-group-text">/ hour</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description & Terms</label>
                        <textarea class="form-control" name="description" rows="4" placeholder="Include driver? Minimum hours? Fuel terms?"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Upload Photo (Optional)</label>
                        <input type="file" class="form-control" name="image" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-warning fw-bold w-100">List for Rent</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
