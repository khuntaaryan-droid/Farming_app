{% extends 'base.html' %}
{% block title %}Delete Agro Product{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger border-top border-3">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-circle text-danger mb-3" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mb-3">Delete Product?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ product.name }}</strong>? This action cannot be undone.</p>
                
                <form method="post" class="d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url 'agro_dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete It</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
